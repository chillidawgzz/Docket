services:
  docket:
    build: .
    image: docket:mvp
    ports:
      - "8420:8420"
    env_file:
      - .env
    environment:
      PORT: "8420"
      # DB lives in the mounted dir so SQLite's -wal/-shm files persist with it
      DB_PATH: /app/data/data.db
    volumes:
      # Persist SQLite + attachment cache
      - ./data:/app/data
    restart: unless-stopped
